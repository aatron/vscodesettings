# Development worktree launcher (Windows-native tab variant).
# Installed by install.ps1 into herdr-plus quick-actions/.
# Same as New Dev Worktree, but herdr keeps only notes + pwsh tabs
# (claude/cursor tabs are closed - use native Windows CLIs separately if needed).
# Opens a real herdr tab (overlay cannot host interactive gum prompts).
# herdr-plus runs quick-action commands via PowerShell -Command (see new-worktree-dev.toml).
name = "New Dev Worktree (Windows)"
description = "Create development worktrees with notes + pwsh tabs only"
type = "command"
command = "& \"{{.Home}}\\bin\\worktree-launch.ps1\" development-windows {{.WorkspaceId}} \"{{.WorkDir}}\""
