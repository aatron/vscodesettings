# Review worktree launcher.
# Installed by install.sh into herdr-plus quick-actions/.
name = "New Review Worktree"
description = "Create review worktrees for each branch on a story"
type = "command"
# herdr-plus leaves stdin as /dev/null; the script reattaches to the pane tty.
command = '"$HOME/bin/make-worktree.sh" review'
