# Worktree auto-layout applied to every repo (wildcard).
# Installed into herdr-plus worktrees/ by install.sh — you do NOT need a
# per-repo toml unless you want a repo-specific override.
#
# Tabs open at the worktree root when herdr creates/opens a worktree.
# On create, make-worktree.sh renames claude/cursor/bash to "{repo} claude" /
# "{repo} cursor" / "{repo} bash" (herdr-plus layouts cannot interpolate the
# repo name). For development-windows worktrees, make-worktree.sh instead closes
# the claude/cursor tabs and opens native Windows PowerShell tabs via wt.exe.
repo = "*"

# Per-repo notes: each worktree opens its own <id>-<slug>-<repo>.txt via the
# sidecar make-worktree.sh writes at ../.notespath-<repo> (repo = worktree dir).
[[tabs]]
name = "notes"
command = 'micro "$(cat "../.notespath-$(basename "$PWD")")"'

[[tabs]]
name = "claude"
command = "claude"

[[tabs]]
name = "cursor"
command = "agent"

[[tabs]]
name = "bash"
