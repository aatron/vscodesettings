# Delete-story launcher.
# Installed by install.sh into herdr-plus quick-actions/.
# Opens a real herdr tab (overlay cannot host interactive gum prompts) and runs
# worktree-remove.sh, which deletes every worktree, branch, and notes file for
# a story after confirmation.
name = "Delete Story Worktree"
description = "Remove all worktrees, local branches, and notes for a story"
type = "command"
command = '"$HOME/bin/worktree-launch.sh" remove {{.WorkspaceId}} "{{.WorkDir}}"'
